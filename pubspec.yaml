name: quizverse1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Urbanist
      fonts:
        - asset: fonts/Urbanist/Urbanist-Regular.ttf
          weight: 400
        - asset: fonts/Urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: fonts/Urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: fonts/Urbanist/Urbanist-Bold.ttf
          weight: 700